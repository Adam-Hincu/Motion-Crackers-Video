<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Motion Crackers — Launch</title>
    <script src="assets/js/gsap.min.js"></script>
    <script src="assets/js/MorphSVGPlugin.min.js"></script>
    <style>
      @font-face {
        font-family: "Switzer";
        src: url("assets/fonts/Switzer-Variable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Switzer";
        src: url("assets/fonts/Switzer-VariableItalic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/geist-mono-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }

      :root {
        --bg: #f7f7f7;
        --ink: #0a0a0a;
        --muted: #7d7d7d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Switzer", sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      #bg {
        background: var(--bg);
      }

      /* ---------- kinetic sentences ---------- */
      .line {
        position: absolute;
        left: 0;
        width: 1920px;
        display: flex;
        justify-content: center;
        white-space: nowrap;
        font-weight: 600;
        line-height: 1;
      }
      .w {
        display: inline-block;
        overflow: hidden;
        padding: 0.12em 0 0.2em;
        margin: -0.12em 0 -0.2em;
        vertical-align: bottom;
      }
      .wi {
        display: inline-block;
      }
      .sp {
        display: inline-block;
        width: 0.26em;
      }
      .slot {
        visibility: hidden;
      }
      .big {
        font-size: 150px;
        letter-spacing: -0.045em;
      }
      .mid {
        font-size: 140px;
        letter-spacing: -0.045em;
      }
      .prompt {
        font-size: 66px;
        font-weight: 480;
        letter-spacing: -0.022em;
        color: var(--muted);
      }
      .head {
        font-size: 84px;
        letter-spacing: -0.035em;
      }

      #hero {
        position: absolute;
        left: 0;
        top: 0;
        width: 100px;
        height: 100px;
        overflow: visible;
      }
      #flood {
        position: absolute;
        left: 0;
        top: 0;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #ffd43b;
      }

      /* ---------- gallery wall ---------- */
      #wallMask {
        position: absolute;
        inset: 0;
        --m: 1;
        --zx: 0;
        --zy: 0;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: calc(1920px * var(--m)) calc(1080px * var(--m));
        mask-size: calc(1920px * var(--m)) calc(1080px * var(--m));
        -webkit-mask-position: calc(var(--zx) * 1px * (1 - var(--m))) calc(var(--zy) * 1px * (1 - var(--m)));
        mask-position: calc(var(--zx) * 1px * (1 - var(--m))) calc(var(--zy) * 1px * (1 - var(--m)));
      }
      #wall {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      .tile {
        position: absolute;
        overflow: hidden;
        border-radius: 14px;
      }
      .tile svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ---------- prompt card ---------- */
      #cardWrap {
        position: absolute;
        left: 410px;
        top: 290.625px;
        width: 1100px;
        height: 618.75px;
        perspective: 2600px;
      }
      #cardInner {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .face {
        position: absolute;
        inset: 0;
        border-radius: 67px;
        overflow: hidden;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
      }
      .face svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .back {
        background: #ffffff;
        transform: rotateY(180deg);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      }
      .ptext {
        position: absolute;
        left: 96px;
        top: 196px;
        width: 908px;
        font-size: 94px;
        font-weight: 500;
        line-height: 1.16;
        letter-spacing: -0.025em;
        color: var(--ink);
        white-space: normal;
      }
      .pw {
        display: inline-block;
      }

      /* ---------- end card ---------- */
      #logo {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
      }
      #url {
        position: absolute;
        left: 0;
        top: 596px;
        width: 1920px;
        display: flex;
        justify-content: center;
        font-size: 48px;
        font-weight: 450;
        letter-spacing: -0.015em;
        line-height: 1;
        color: var(--muted);
      }
      #mark {
        position: absolute;
        width: 170px;
        height: 170px;
        overflow: visible;
      }
      #word {
        position: absolute;
        font-size: 128px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1;
        white-space: nowrap;
      }
      .ch {
        position: relative;
        display: inline-block;
      }
      .ch .fin {
        display: inline-block;
      }
      .alt {
        position: absolute;
        left: 50%;
        top: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateX(-50%);
        white-space: nowrap;
        opacity: 0;
      }
      .alt svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.5" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="16.5" data-track-index="0"></div>

      <!-- Scenes 1-4: the shape, then the sentences it punctuates -->
      <section id="sText" class="clip" data-start="0" data-duration="6.5" data-track-index="1">
        <div id="flood"></div>
        <div class="line big" id="L1" style="top: 465px">
          <span class="w"><span class="wi">AI</span></span><span class="sp"></span><span class="w"><span class="wi">made</span></span><span class="sp"></span><span class="w"><span class="wi">this</span></span><span class="sp"></span><span class="w"><span class="wi">video</span></span><span class="slot" id="slot1">.</span>
        </div>
        <div class="line mid" id="L2" style="top: 388px">
          <span class="w"><span class="wi">From</span></span><span class="sp"></span><span class="w"><span class="wi">one</span></span><span class="sp"></span><span class="w"><span class="wi">prompt</span></span><span class="slot" id="slot2">.</span>
        </div>
        <div class="line prompt" id="LP" style="top: 600px">
          <span class="w"><span class="wi">“a</span></span><span class="sp"></span><span class="w"><span class="wi">dot</span></span><span class="sp"></span><span class="w"><span class="wi">that</span></span><span class="sp"></span><span class="w"><span class="wi">blooms</span></span><span class="sp"></span><span class="w"><span class="wi">into</span></span><span class="sp"></span><span class="w"><span class="wi">a</span></span><span class="sp"></span><span class="w"><span class="wi">flower”</span></span>
        </div>
        <div class="line mid" id="L3" style="top: 400px">
          <span class="w"><span class="wi">We</span></span><span class="sp"></span><span class="w"><span class="wi">call</span></span><span class="sp"></span><span class="w"><span class="wi">it</span></span><span class="sp"></span><span class="w"><span class="wi">a</span></span><span class="sp"></span><span class="w"><span class="wi">cracker</span></span><span class="slot" id="slot3">.</span>
        </div>
        <div class="line prompt" id="LS" style="top: 600px">
          <span class="w"><span class="wi">…or,</span></span><span class="sp"></span><span class="w"><span class="wi">a</span></span><span class="sp"></span><span class="w"><span class="wi">motion</span></span><span class="sp"></span><span class="w"><span class="wi">design</span></span><span class="sp"></span><span class="w"><span class="wi">video</span></span>
        </div>
        <svg id="hero" viewBox="0 0 100 100"><path id="heroPath" d="" fill="#0a0a0a" /></svg>
      </section>

      <!-- Scenes 5-6: the gallery wall, then the wall seen through type -->
      <section id="sWall" class="clip" data-start="6.5" data-duration="3.6" data-track-index="2">
        <div id="wallMask"><div id="wall"></div></div>
      </section>

      <!-- Scenes 7-8: one cracker turns over to show its prompt -->
      <section id="sCard" class="clip" data-start="10.1" data-duration="3.0" data-track-index="3">
        <div class="line head" id="H1" style="top: 128px">
          <span class="w"><span class="wi">Each</span></span><span class="sp"></span><span class="w"><span class="wi">one</span></span><span class="sp"></span><span class="w"><span class="wi">comes</span></span><span class="sp"></span><span class="w"><span class="wi">with</span></span><span class="sp"></span><span class="w"><span class="wi">its</span></span><span class="sp"></span><span class="w"><span class="wi">prompt.</span></span>
        </div>
        <div class="line head" id="H2" style="top: 128px">
          <span class="w"><span class="wi">Copy</span></span><span class="sp"></span><span class="w"><span class="wi">it.</span></span>
        </div>
        <div class="line head" id="H3" style="top: 128px">
          <span class="w"><span class="wi">Make</span></span><span class="sp"></span><span class="w"><span class="wi">your</span></span><span class="sp"></span><span class="w"><span class="wi">own.</span></span>
        </div>
        <div id="cardWrap">
          <div id="cardInner">
            <div class="face front" id="cardFront"></div>
            <div class="face back"><p class="ptext" id="backText"></p></div>
          </div>
        </div>
        <p class="ptext" id="copyText"></p>
      </section>

      <!-- Scene 9: the brand -->
      <section id="sEnd" class="clip" data-start="12.5" data-duration="4.0" data-track-index="4">
        <div id="logo">
          <svg id="mark" viewBox="0 0 24 24"><path id="markPath" fill="#0a0a0a" d="M12 6.4a5.6 5.6 0 1 1 0 11.2a5.6 5.6 0 1 1 0-11.2z" /></svg>
          <div id="word"></div>
          <div id="url"><span class="w"><span class="wi">motioncrackers.com</span></span></div>
        </div>
      </section>

      <audio id="music" src="assets/music.wav" data-start="0" data-duration="16.5" data-track-index="9"></audio>
    </div>

    <script>
      gsap.registerPlugin(MorphSVGPlugin);

      // ---------- constants ----------
      const C = { x: 960, y: 540 };
      const COL = {
        ink: "#0a0a0a", Y: "#ffd43b", B: "#2f5bff", O: "#ff6b2c", P: "#ff6fb0", G: "#22c77a",
        V: "#7c5cff", R: "#ff3d2e", Cy: "#2bc4f0", K: "#111111", W: "#ffffff", L: "#e4e4e4", M: "#bdf3d8",
      };
      // From tools/text_mask.py (mask-gallery.json): the period of "them." and the 2nd "l" of "gallery".
      const MASK_PERIOD = { x: (1413.74 + 1463.3) / 2, y: (862.84 + 912.4) / 2 };
      const MASK_L = { x: (916.18 + 964.62) / 2, y: (439.2 + 640.8) / 2 };

      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // ---------- polar shapes (100x100 box, centre 50/50) ----------
      // Every shape is sampled at the same 240 angles, so a morph is a pure
      // per-ray radius blend: no twisting, no point sliding.
      const N = 240;
      const SH = {
        dot: () => 22,
        square: (t) => 19 / Math.max(Math.abs(Math.cos(t)), Math.abs(Math.sin(t))),
        squircle: (t) => 25 * Math.pow(Math.pow(Math.abs(Math.cos(t)), 4) + Math.pow(Math.abs(Math.sin(t)), 4), -0.25),
        flower4: (t) => 25 + 7 * Math.cos(4 * t),
        flower8: (t) => 30 + 8 * Math.cos(8 * t),
      };
      function polar(f, cx = 50, cy = 50, s = 1) {
        let d = "";
        for (let i = 0; i < N; i++) {
          const t = (i / N) * Math.PI * 2;
          const r = f(t) * s;
          const a = t - Math.PI / 2;
          d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(3) + " " + (cy + r * Math.sin(a)).toFixed(3);
        }
        return d + "Z";
      }
      const P = Object.fromEntries(Object.keys(SH).map((k) => [k, polar(SH[k])]));
      const morph = (shape) => ({ shape: P[shape], shapeIndex: 0, type: "linear" });

      // ---------- tiles ----------
      const TILE_W = 230, GAP = 18, COLS = 9;
      const X0 = (1920 - (COLS * TILE_W + (COLS - 1) * GAP)) / 2;
      const RATIOS = [[16, 9], [9, 16], [1, 1], [4, 5], [21, 9], [4, 3], [3, 4]];

      // Each design draws inside a 100 x h viewBox and returns [svg markup, animate(tl, root, t0, t1)].
      function loops(t0, t1, period) {
        return Math.max(0, Math.floor((t1 - t0) / period) - 1);
      }
      const DESIGNS = {
        flower(h, c) {
          const m = Math.min(100, h) / 100;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><g transform="translate(50 ${h / 2}) scale(${m}) translate(-50 -50)"><path class="a" d="${P.flower8}" fill="${c.fg}"/></g>`,
            (tl, el, t0, t1) => {
              const a = el.querySelector(".a");
              let rot = 0;
              for (let t = t0 + 0.5; t < t1; t += 0.5, rot += 45)
                tl.fromTo(a, { rotation: rot }, { rotation: rot + 45, svgOrigin: "50 50", duration: 0.32, ease: "back.out(2)", immediateRender: false }, t);
            },
          ];
        },
        ball(h, c) {
          const r = 7.2, floor = h - 9;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><ellipse class="s" cx="50" cy="${floor + 1.6}" rx="9" ry="1.8" fill="rgba(0,0,0,.22)"/><circle class="b" cx="50" cy="${floor - r}" r="${r}" fill="${c.fg}"/>`,
            (tl, el, t0, t1) => {
              const b = el.querySelector(".b"), s = el.querySelector(".s");
              const top = -(floor - r - 12);
              // contact on every beat (t0 is a beat): up 0.25s, down 0.25s
              tl.set(b, { y: 0, scaleX: 1, scaleY: 1, svgOrigin: `50 ${floor}` }, t0);
              for (let t = t0; t < t1 - 0.01; t += 0.5) {
                tl.fromTo(b, { scaleX: 1.28, scaleY: 0.74 }, { scaleX: 1, scaleY: 1, svgOrigin: `50 ${floor}`, duration: 0.12, ease: "power2.out" }, t);
                tl.to(b, { y: top, duration: 0.25, ease: "power2.out" }, t);
                tl.to(b, { y: 0, duration: 0.25, ease: "power2.in" }, t + 0.25);
                tl.fromTo(s, { scaleX: 1, opacity: 1 }, { scaleX: 0.45, opacity: 0.35, svgOrigin: `50 ${floor + 1.6}`, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, t);
              }
            },
          ];
        },
        stripes(h, c) {
          let s = "";
          for (let i = -8; i < 16; i++) s += `<rect x="${i * 16}" y="-100" width="7" height="${h + 200}" fill="${c.fg}"/>`;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><g transform="translate(50 ${h / 2}) rotate(35) translate(-50 ${-h / 2})"><g class="a">${s}</g></g>`,
            (tl, el, t0, t1) => tl.fromTo(el.querySelector(".a"), { x: 0 }, { x: 16, duration: 0.5, ease: "none", repeat: loops(t0, t1, 0.5) }, t0),
          ];
        },
        dots(h, c) {
          let s = "";
          const n = 5, sp = 100 / n;
          for (let j = 0; j < Math.ceil(h / sp); j++)
            for (let i = 0; i < n; i++)
              s += `<circle class="d" data-k="${i + j}" cx="${sp / 2 + i * sp}" cy="${sp / 2 + j * sp}" r="${sp * 0.32}" fill="${c.fg}"/>`;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/>${s}`,
            (tl, el, t0, t1) =>
              el.querySelectorAll(".d").forEach((d) =>
                tl.fromTo(d, { scale: 1, transformOrigin: "50% 50%" }, { scale: 0.25, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: loops(t0, t1, 0.5) }, t0 + (+d.dataset.k % 4) * 0.125)
              ),
          ];
        },
        rings(h, c) {
          let s = "";
          for (let i = 0; i < 3; i++) s += `<circle class="r" cx="50" cy="${h / 2}" r="${Math.max(h, 100) * 0.42}" fill="none" stroke="${c.fg}" stroke-width="3"/>`;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/>${s}<circle cx="50" cy="${h / 2}" r="5" fill="${c.fg}"/>`,
            (tl, el, t0, t1) =>
              el.querySelectorAll(".r").forEach((r, i) =>
                tl.fromTo(r, { scale: 0.05, opacity: 1, svgOrigin: `50 ${h / 2}` }, { scale: 1, opacity: 0, duration: 1.5, ease: "power1.out", repeat: loops(t0, t1, 1.5) }, t0 - 1.5 + i * 0.5)
              ),
          ];
        },
        word(h, c) {
          const txt = c.txt || "pop";
          const fs = Math.min(100, h) * 0.38;
          // Switzer 800 advances (em) for the letters these tiles use
          const ADV = { w: 0.86, o: 0.64, p: 0.65 };
          const width = [...txt].reduce((a, ch) => a + ADV[ch] * fs, 0);
          let s = "", x = 50 - width / 2;
          for (const ch of txt) {
            s += `<text class="l" x="${x}" y="${h / 2 + fs * 0.36}" font-family="Switzer" font-weight="800" font-size="${fs}" fill="${c.fg}">${ch}</text>`;
            x += ADV[ch] * fs;
          }
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/>${s}`,
            (tl, el, t0, t1) =>
              el.querySelectorAll(".l").forEach((l, i) => {
                for (let t = t0 + i * 0.125; t < t1 - 0.25; t += 0.5) tl.to(l, { y: -fs * 0.28, duration: 0.125, ease: "power2.out", yoyo: true, repeat: 1 }, t);
              }),
          ];
        },
        wave(h, c) {
          let d = "M-100 0";
          for (let x = -100; x <= 200; x += 2) d += ` L${x} ${(Math.sin((x / 40) * Math.PI * 2) * 0.16 * Math.min(h, 100)).toFixed(2)}`;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><g transform="translate(0 ${h / 2})"><path class="a" d="${d}" fill="none" stroke="${c.fg}" stroke-width="4" stroke-linecap="round"/></g>`,
            (tl, el, t0, t1) => tl.fromTo(el.querySelector(".a"), { x: 0 }, { x: -40, duration: 1, ease: "none", repeat: loops(t0, t1, 1) }, t0),
          ];
        },
        squares(h, c) {
          let s = "";
          const m = Math.min(100, h) / 100;
          for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) s += `<rect class="q" data-k="${i + j}" x="${17 + i * 24}" y="${17 + j * 24}" width="18" height="18" fill="${c.fg}"/>`;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><g transform="translate(50 ${h / 2}) scale(${m}) translate(-50 -50)">${s}</g>`,
            (tl, el, t0, t1) =>
              el.querySelectorAll(".q").forEach((q) => {
                let rot = 0;
                for (let t = t0 + (+q.dataset.k) * 0.06; t < t1; t += 0.5, rot += 90)
                  tl.fromTo(q, { rotation: rot }, { rotation: rot + 90, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(1.7)", immediateRender: false }, t);
              }),
          ];
        },
        orbit(h, c) {
          const R = Math.min(100, h) * 0.3;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><circle cx="50" cy="${h / 2}" r="${R * 0.28}" fill="${COL.K}"/><g class="a"><circle cx="${50 + R}" cy="${h / 2}" r="${R * 0.2}" fill="${COL.R}"/><circle cx="${50 - R / 2}" cy="${h / 2 + R * 0.866}" r="${R * 0.2}" fill="${COL.B}"/><circle cx="${50 - R / 2}" cy="${h / 2 - R * 0.866}" r="${R * 0.2}" fill="${COL.Y}"/></g>`,
            (tl, el, t0, t1) => tl.fromTo(el.querySelector(".a"), { rotation: 0 }, { rotation: 360, svgOrigin: `50 ${h / 2}`, duration: 2, ease: "none", repeat: loops(t0, t1, 2) }, t0),
          ];
        },
        blob(h, c) {
          const m = (Math.min(100, h) / 100) * 1.15;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><g transform="translate(50 ${h / 2}) scale(${m}) translate(-50 -50)"><path class="a" d="${P.flower4}" fill="${c.fg}"/></g>`,
            (tl, el, t0, t1) => {
              const a = el.querySelector(".a");
              tl.fromTo(a, { rotation: 0, scale: 1 }, { rotation: 90, scale: 0.8, svgOrigin: "50 50", duration: 1, ease: "sine.inOut", yoyo: true, repeat: loops(t0, t1, 1) }, t0);
            },
          ];
        },
        bars(h, c) {
          let s = "";
          for (let i = 0; i < 6; i++) s += `<rect class="b" data-k="${i}" x="${12 + i * 13}" y="${h * 0.2}" width="8" height="${h * 0.6}" rx="4" fill="${c.fg}"/>`;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/>${s}`,
            (tl, el, t0, t1) =>
              el.querySelectorAll(".b").forEach((b) => {
                const k = +b.dataset.k;
                tl.fromTo(b, { scaleY: 0.25 + ((k * 37) % 5) / 10, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.25, ease: "power2.out", yoyo: true, repeat: loops(t0, t1, 0.25) }, t0 + (k % 2) * 0.125);
              }),
          ];
        },
        half(h, c) {
          const R = Math.min(100, h) * 0.3;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><g class="a"><path d="M${50 - R} ${h / 2} A${R} ${R} 0 0 1 ${50 + R} ${h / 2}Z" fill="${c.fg}"/><path d="M${50 - R} ${h / 2} A${R} ${R} 0 0 0 ${50 + R} ${h / 2}Z" fill="${c.fg2}"/></g>`,
            (tl, el, t0, t1) => {
              let rot = 0;
              for (let t = t0; t < t1; t += 0.5, rot += 180)
                tl.fromTo(el.querySelector(".a"), { rotation: rot }, { rotation: rot + 180, svgOrigin: `50 ${h / 2}`, duration: 0.36, ease: "expo.inOut", immediateRender: false }, t);
            },
          ];
        },
        pill(h, c) {
          const R = Math.min(100, h) * 0.12;
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><rect class="a" x="${50 - R}" y="${h / 2 - R}" width="${2 * R}" height="${2 * R}" rx="${R}" fill="${c.fg}"/>`,
            (tl, el, t0, t1) => tl.fromTo(el.querySelector(".a"), { scaleX: 1 }, { scaleX: 3.2, svgOrigin: `50 ${h / 2}`, duration: 0.25, ease: "power3.inOut", yoyo: true, repeat: loops(t0, t1, 0.25) }, t0),
          ];
        },
        tri(h, c) {
          const R = Math.min(100, h) * 0.3, cy = h / 2;
          const pts = [0, 1, 2].map((i) => `${50 + R * Math.cos(-Math.PI / 2 + (i * 2 * Math.PI) / 3)},${cy + R * Math.sin(-Math.PI / 2 + (i * 2 * Math.PI) / 3)}`).join(" ");
          return [
            `<rect width="100" height="${h}" fill="${c.bg}"/><polygon class="a" points="${pts}" fill="${c.fg}"/>`,
            (tl, el, t0, t1) => {
              let rot = 0;
              for (let t = t0 + 0.25; t < t1; t += 0.5, rot += 120)
                tl.fromTo(el.querySelector(".a"), { rotation: rot }, { rotation: rot + 120, svgOrigin: `50 ${cy}`, duration: 0.3, ease: "back.out(2)", immediateRender: false }, t);
            },
          ];
        },
      };

      // Palettes per design; colours live only inside the crackers, never in the frame.
      const SKINS = [
        ["stripes", { bg: COL.K, fg: COL.Y }],
        ["dots", { bg: COL.K, fg: COL.Cy }],
        ["rings", { bg: COL.P, fg: COL.K }],
        ["word", { bg: COL.K, fg: COL.Y, txt: "pop" }],
        ["wave", { bg: COL.V, fg: COL.K }],
        ["squares", { bg: COL.Y, fg: COL.K }],
        ["orbit", { bg: COL.Cy }],
        ["blob", { bg: COL.O, fg: COL.K }],
        ["bars", { bg: COL.G, fg: COL.K }],
        ["half", { bg: COL.Cy, fg: COL.K, fg2: COL.P }],
        ["pill", { bg: COL.R, fg: COL.K }],
        ["tri", { bg: COL.G, fg: COL.K }],
        ["dots", { bg: COL.B, fg: COL.Y }],
        ["word", { bg: COL.O, fg: COL.K, txt: "wow" }],
        ["stripes", { bg: COL.O, fg: COL.K }],
        ["rings", { bg: COL.K, fg: COL.Cy }],
        ["blob", { bg: COL.V, fg: COL.Y }],
        ["bars", { bg: COL.R, fg: COL.K }],
        ["squares", { bg: COL.B, fg: COL.Y }],
        ["half", { bg: COL.Y, fg: COL.R, fg2: COL.K }],
        ["wave", { bg: COL.K, fg: COL.Y }],
        ["tri", { bg: COL.P, fg: COL.K }],
        ["pill", { bg: COL.G, fg: COL.K }],
        ["orbit", { bg: COL.P }],
      ];

      function makeTile(design, skin, x, y, rw, rh) {
        const h = (100 * rh) / rw;
        const [markup, anim] = DESIGNS[design](h, skin);
        const el = document.createElement("div");
        el.className = "tile";
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.width = TILE_W + "px";
        el.style.height = (TILE_W * rh) / rw + "px";
        el.innerHTML = `<svg viewBox="0 0 100 ${h}" preserveAspectRatio="none">${markup}</svg>`;
        return { el, anim, h: (TILE_W * rh) / rw };
      }

      // ---------- word helpers ----------
      const wis = (sel) => gsap.utils.toArray(sel + " .wi");
      function wordsIn(tl, sel, times, dur = 0.6) {
        wis(sel).forEach((w, i) => tl.fromTo(w, { yPercent: 150 }, { yPercent: 0, duration: dur, ease: "expo.out" }, times[i]));
      }
      function wordsOut(tl, sel, t, dir = -1) {
        wis(sel).forEach((w, i) => tl.to(w, { yPercent: 150 * dir, duration: 0.26, ease: "power3.in" }, t + i * 0.018));
      }

      function measureSlot(id, fontPx) {
        // Centre of the (transparent) period glyph that the hero replaces.
        const el = document.getElementById(id);
        const r = el.getBoundingClientRect();
        const cs = getComputedStyle(el.parentElement);
        const ctx = document.createElement("canvas").getContext("2d");
        ctx.font = `${cs.fontWeight} ${fontPx}px Switzer`;
        const m = ctx.measureText(".");
        const probe = document.createElement("span");
        probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
        el.appendChild(probe);
        const baseY = probe.getBoundingClientRect().top;
        probe.remove();
        const left = r.left + (r.width - (m.actualBoundingBoxRight + m.actualBoundingBoxLeft)) / 2;
        const size = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
        return { x: left + (m.actualBoundingBoxRight + m.actualBoundingBoxLeft) / 2, y: baseY - m.actualBoundingBoxAscent + size / 2, size };
      }

      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        const hero = document.getElementById("hero");
        const heroPath = document.getElementById("heroPath");
        heroPath.setAttribute("d", P.dot);

        // hero placement helper: centre (x,y) and scale relative to the 100px box
        const at = (x, y) => ({ x: x - 50, y: y - 50 });

        // hide every sentence word up front
        tl.set(".wi", { yPercent: 150 }, 0);
        tl.set(hero, { ...at(C.x, C.y), scale: 0, rotation: 0, transformOrigin: "50% 50%" }, 0);
        tl.set("#flood", { x: C.x - 50, y: C.y - 50, scale: 0, transformOrigin: "50% 50%" }, 0);

        // ===== Scene 1 (0 - 1.5): a dot becomes a flower, one beat at a time =====
        tl.to(hero, { scale: 4, duration: 0.42, ease: "back.out(2.2)" }, 0);
        tl.set(heroPath, { fill: COL.O }, 0.5);
        tl.to(heroPath, { morphSVG: morph("squircle"), duration: 0.3, ease: "power3.inOut" }, 0.5);
        tl.to(hero, { rotation: 90, duration: 0.45, ease: "back.out(1.8)" }, 0.5);
        tl.fromTo(hero, { scaleX: 4, scaleY: 4 }, { keyframes: [{ scaleX: 4.5, scaleY: 3.6, duration: 0.08 }, { scaleX: 4, scaleY: 4, duration: 0.3, ease: "back.out(3)" }], immediateRender: false }, 0.5);
        tl.set(heroPath, { fill: COL.P }, 1.0);
        tl.to(heroPath, { morphSVG: morph("flower4"), duration: 0.32, ease: "power3.inOut" }, 1.0);
        tl.to(hero, { rotation: 180, duration: 0.45, ease: "back.out(1.8)" }, 1.0);
        tl.fromTo(hero, { scaleX: 4, scaleY: 4 }, { keyframes: [{ scaleX: 3.6, scaleY: 4.5, duration: 0.08 }, { scaleX: 4, scaleY: 4, duration: 0.3, ease: "back.out(3)" }], immediateRender: false }, 1.0);

        // ===== Scene 2 (1.5 - 3.0): "AI made this." — the flower becomes the period =====
        const s1 = measureSlot("slot1", 150);
        const s2 = measureSlot("slot2", 140);
        const s3 = measureSlot("slot3", 140);
        const pScale = (s) => s.size / 38; // square half-size 19 => side 38 units

        wordsIn(tl, "#L1", [1.5, 1.625, 1.75, 1.875]);
        tl.to(heroPath, { morphSVG: morph("square"), duration: 0.4, ease: "power2.inOut" }, 1.55);
        tl.to(hero, { x: s1.x - 50, duration: 0.45, ease: "expo.inOut" }, 1.55);
        tl.to(hero, { y: s1.y - 50, duration: 0.45, ease: "power4.inOut" }, 1.55);
        tl.to(hero, { scale: pScale(s1), rotation: 360, duration: 0.45, ease: "expo.inOut" }, 1.55);
        tl.fromTo(hero, { scaleX: pScale(s1), scaleY: pScale(s1) }, { keyframes: [{ scaleX: pScale(s1) * 1.35, scaleY: pScale(s1) * 0.7, duration: 0.06 }, { scaleX: pScale(s1), scaleY: pScale(s1), duration: 0.28, ease: "back.out(3)" }], immediateRender: false }, 2.0);

        // ===== Scene 3 (3.0 - 4.5): "From one prompt." + the prompt itself =====
        wordsOut(tl, "#L1", 2.55);
        wordsIn(tl, "#L2", [2.75, 2.875, 3.0]);
        tl.to(hero, { x: s2.x - 50, duration: 0.5, ease: "power3.inOut" }, 2.75);
        tl.to(hero, { keyframes: [{ y: s2.y - 50 - 120, duration: 0.25, ease: "power2.out" }, { y: s2.y - 50, duration: 0.25, ease: "power2.in" }] }, 2.75);
        tl.to(hero, { scale: pScale(s2), rotation: 450, duration: 0.5, ease: "power3.inOut" }, 2.75);
        tl.set(heroPath, { fill: COL.O }, 3.25);
        tl.fromTo(hero, { scaleX: pScale(s2), scaleY: pScale(s2) }, { keyframes: [{ scaleX: pScale(s2) * 1.35, scaleY: pScale(s2) * 0.7, duration: 0.06 }, { scaleX: pScale(s2), scaleY: pScale(s2), duration: 0.28, ease: "back.out(3)" }], immediateRender: false }, 3.25);
        wordsIn(tl, "#LP", [3.25, 3.375, 3.5, 3.625, 3.75, 3.875, 4.0], 0.45);

        // ===== Scene 4 (4.5 - 6.0): "We call it a cracker." — the period blooms =====
        wordsOut(tl, "#L2", 4.55);
        wordsOut(tl, "#LP", 4.5, 1);
        wordsIn(tl, "#L3", [4.75, 4.875, 5.0, 5.125, 5.25]);
        wordsIn(tl, "#LS", [5.0, 5.125, 5.25, 5.375, 5.5], 0.45);
        tl.to(hero, { x: s3.x - 50, duration: 0.75, ease: "power3.inOut" }, 4.75);
        tl.to(hero, { keyframes: [{ y: s3.y - 50 - 160, duration: 0.37, ease: "power2.out" }, { y: s3.y - 50, duration: 0.38, ease: "power2.in" }] }, 4.75);
        tl.to(hero, { scale: pScale(s3), rotation: 540, duration: 0.75, ease: "power3.inOut" }, 4.75);
        tl.set(heroPath, { fill: COL.ink }, 5.5);
        tl.fromTo(hero, { scaleX: pScale(s3), scaleY: pScale(s3) }, { keyframes: [{ scaleX: pScale(s3) * 1.35, scaleY: pScale(s3) * 0.7, duration: 0.06 }, { scaleX: pScale(s3), scaleY: pScale(s3), duration: 0.2, ease: "back.out(3)" }], immediateRender: false }, 5.5);
        // bloom on the beat, stepping up and away from the word
        tl.set(heroPath, { fill: COL.B }, 5.75);
        tl.to(heroPath, { morphSVG: morph("flower8"), duration: 0.34, ease: "back.out(1.6)" }, 5.75);
        tl.to(hero, { x: s3.x - 50 + 62, y: s3.y - 50 - 46, scale: pScale(s3) * 2.6, rotation: 585, duration: 0.34, ease: "back.out(1.6)" }, 5.75);

        // ===== Break (6.0 - 6.5): the flower takes the frame, yellow floods in =====
        wordsOut(tl, "#L3", 6.0, 1);
        wordsOut(tl, "#LS", 6.0, 1);
        tl.to(hero, { ...at(C.x, C.y), scale: 4, rotation: 675, duration: 0.3, ease: "power3.inOut" }, 6.0);
        tl.to("#flood", { scale: 26, duration: 0.32, ease: "power2.in" }, 6.18);
        tl.to(hero, { scale: (TILE_W * 9) / 100, rotation: 720, duration: 0.2, ease: "power2.in" }, 6.3);

        // ===== Wall (6.5 - 10.1) =====
        const wall = document.getElementById("wall");
        const wallMask = document.getElementById("wallMask");
        const R = rng(7);
        const tiles = [];
        const heroTile = { col: 4, y: 540 - TILE_W / 2, ratio: [1, 1] };
        const ballTile = { col: 5, y: 560 - (TILE_W * 9) / 32, ratio: [16, 9] };
        let skinIx = 0;
        const nextSkin = () => SKINS[skinIx++ % SKINS.length];
        let ratioIx = 3;
        const nextRatio = () => RATIOS[(ratioIx += 3) % RATIOS.length];
        let ball = null, flower = null;
        for (let col = 0; col < COLS; col++) {
          const x = X0 + col * (TILE_W + GAP);
          const fixed = col === heroTile.col ? heroTile : col === ballTile.col ? ballTile : null;
          const place = (y, ratio, kind) => {
            const [d, s] = kind === "flower" ? ["flower", { bg: COL.Y, fg: COL.B }] : kind === "ball" ? ["ball", { bg: COL.B, fg: COL.O }] : nextSkin();
            const t = makeTile(d, s, x, y, ratio[0], ratio[1]);
            wall.appendChild(t.el);
            tiles.push(t);
            if (kind === "ball") ball = t;
            if (kind === "flower") flower = t;
            return t.h;
          };
          if (fixed) {
            const fh = place(fixed.y, fixed.ratio, col === heroTile.col ? "flower" : "ball");
            let y = fixed.y;
            while (y > -420) {
              const r = nextRatio();
              const th = (TILE_W * r[1]) / r[0];
              y -= GAP + th;
              place(y, r);
            }
            y = fixed.y + fh + GAP;
            while (y < 1500) {
              const r = nextRatio();
              y += place(y, r) + GAP;
            }
          } else {
            let y = -420 - ((col * 97) % 190);
            while (y < 1500) {
              const r = nextRatio();
              y += place(y, r) + GAP;
            }
          }
        }
        tiles.forEach((t) => t.anim(tl, t.el, 6.5, 10.6));

        // camera: start with the flower tile filling the frame, pull back on the drop
        tl.set(wall, { transformOrigin: "960px 540px", scale: 9, x: 0, y: 0 }, 6.5);
        tl.to(wall, { scale: 1, duration: 0.95, ease: "expo.out" }, 6.5);
        tl.to(wall, { y: -70, duration: 3.0, ease: "none" }, 6.5);

        // the wall seen through "A whole gallery of them." — zoom out of the period
        const M0 = 58;
        const z1 = { x: (C.x - MASK_PERIOD.x * M0) / (1 - M0), y: (C.y - MASK_PERIOD.y * M0) / (1 - M0) };
        tl.set(wallMask, { webkitMaskImage: "none", maskImage: "none" }, 6.5);
        tl.set(wallMask, { webkitMaskImage: "url(assets/mask-gallery.svg)", maskImage: "url(assets/mask-gallery.svg)", "--zx": z1.x, "--zy": z1.y, "--m": M0 }, 8.0);
        tl.to(wallMask, { "--m": 1, duration: 0.85, ease: "expo.out" }, 8.0);
        tl.set(wallMask, { backgroundColor: "rgba(10,10,10,0)" }, 6.5);
        tl.set(wallMask, { backgroundColor: "rgba(10,10,10,1)" }, 8.0);
        tl.set(wallMask, { backgroundColor: "rgba(10,10,10,0)" }, 9.75);

        // dive into the "l" (already at frame centre) while the camera flies to the ball tile
        const M1 = 52;
        tl.set(wallMask, { "--zx": MASK_L.x, "--zy": MASK_L.y }, 9.5);
        tl.to(wallMask, { "--m": M1, duration: 0.38, ease: "power3.in" }, 9.5);
        tl.set(wallMask, { webkitMaskImage: "none", maskImage: "none" }, 9.88);

        const k = 1100 / TILE_W;
        const B = { x: X0 + ballTile.col * (TILE_W + GAP) + TILE_W / 2, y: ballTile.y + (TILE_W * 9) / 32 };
        const T0 = { x: 0, y: -70 };
        const CARD = { x: 960, y: 600 };
        const O = { x: (CARD.x - T0.x - k * B.x) / (1 - k), y: (CARD.y - T0.y - k * B.y) / (1 - k) };
        tl.set(wall, { transformOrigin: `${O.x}px ${O.y}px` }, 9.5);
        tl.to(wall, { scale: k, duration: 0.6, ease: "power3.inOut" }, 9.5);
        tiles.forEach((t) => {
          if (t !== ball) tl.to(t.el, { opacity: 0, duration: 0.25, ease: "power1.in" }, 9.8);
        });

        // ===== Card (10.1 - 12.6) =====
        const [frontMarkup, frontAnim] = DESIGNS.ball((100 * 9) / 16, { bg: COL.B, fg: COL.O });
        const front = document.getElementById("cardFront");
        front.innerHTML = `<svg viewBox="0 0 100 ${(100 * 9) / 16}" preserveAspectRatio="none">${frontMarkup}</svg>`;
        frontAnim(tl, front, 6.5, 12.6);

        const promptWords = "“An orange ball bouncing to the beat.”".split(" ");
        const fill = (el) => (el.innerHTML = promptWords.map((w) => `<span class="pw">${w}</span>`).join(" "));
        fill(document.getElementById("backText"));
        fill(document.getElementById("copyText"));
        const copyText = document.getElementById("copyText");
        copyText.style.left = 410 + 96 + "px";
        copyText.style.top = 290.625 + 196 + "px";

        const cardInner = document.getElementById("cardInner");
        const cardWrap = document.getElementById("cardWrap");
        tl.set(copyText, { opacity: 0 }, 10.1);
        tl.to(cardInner, { rotationY: -180, duration: 0.62, ease: "power3.inOut" }, 10.2);
        tl.to(cardWrap, { keyframes: [{ scale: 0.9, duration: 0.31, ease: "power2.out" }, { scale: 1, duration: 0.31, ease: "power2.in" }] }, 10.2);
        wordsIn(tl, "#H1", [10.25, 10.375, 10.5, 10.625, 10.75, 10.875], 0.55);

        // "Copy it." — the prompt lifts off the card
        wordsOut(tl, "#H1", 11.45);
        wordsIn(tl, "#H2", [11.75, 11.875], 0.3);
        tl.set(copyText, { opacity: 1 }, 11.75);
        tl.set("#backText", { opacity: 0 }, 11.75);
        tl.to(copyText, { keyframes: [{ y: -26, scale: 1.04, duration: 0.18, ease: "power2.out" }, { y: -10, scale: 1, duration: 0.3, ease: "back.out(2)" }], transformOrigin: "50% 50%" }, 11.75);
        tl.to(cardWrap, { y: 1050, rotation: 7, duration: 0.45, ease: "power3.in" }, 11.8);

        // "Make your own." — the card drops away, the copied prompt stays
        wordsOut(tl, "#H2", 11.98);
        wordsIn(tl, "#H3", [12.25, 12.375, 12.5], 0.32);
        tl.to(copyText, { y: 30, duration: 0.3, ease: "power3.inOut" }, 12.2);
        wordsOut(tl, "#H3", 12.85);

        // the prompt collapses into one dot at the frame centre
        const pws = gsap.utils.toArray("#copyText .pw");
        const ctRect = { left: 410 + 96, top: 290.625 + 196 + 30 };
        pws.forEach((w, i) => {
          const cx = ctRect.left + w.offsetLeft + w.offsetWidth / 2;
          const cy = ctRect.top + w.offsetTop + w.offsetHeight / 2;
          tl.to(w, { x: C.x - cx, y: C.y - cy, scale: 0.05, opacity: 0, duration: 0.24, ease: "power3.in" }, 12.5 + i * 0.012);
        });

        // ===== End (12.5 - 15): dot -> bolt, wordmark glitches into place =====
        const word = document.getElementById("word");
        const mark = document.getElementById("mark");
        const markPath = document.getElementById("markPath");
        const NAME = "Motion Crackers";
        word.innerHTML = [...NAME].map((ch) => (ch === " " ? `<span class="ch sp" style="width:0.24em"></span>` : `<span class="ch"><span class="fin">${ch}</span></span>`)).join("");
        const wordW = word.getBoundingClientRect().width;
        const markS = 170, gap = 50;
        const total = markS + gap + wordW;
        const left = (1920 - total) / 2;
        mark.style.left = left + "px";
        mark.style.top = 540 - markS / 2 + "px";
        word.style.left = left + markS + gap + "px";
        word.style.top = 540 - 64 + "px";
        const markC = { x: left + markS / 2, y: 540 };

        const ZAP = "M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z";
        tl.set(mark, { x: C.x - markC.x, y: 0, scale: 0, transformOrigin: "50% 50%" }, 12.5);
        tl.to(mark, { scale: 0.62, duration: 0.25, ease: "power3.out" }, 12.55);
        tl.to(markPath, { morphSVG: { shape: ZAP, shapeIndex: "auto" }, duration: 0.42, ease: "expo.inOut" }, 12.78);
        tl.to(mark, { x: 0, scale: 1, duration: 0.52, ease: "expo.inOut" }, 12.8);

        // glitch: every letter cycles through odd alternates, then lands left to right
        const R2 = rng(2026);
        const SHAPES = ["dot", "square", "squircle", "flower4", "flower8"];
        const palette = [COL.B, COL.O, COL.P, COL.G, COL.V, COL.R, COL.Y, COL.Cy];
        const altMarkup = (ch, kind) => {
          const col = palette[Math.floor(R2() * palette.length)];
          switch (kind) {
            case 0: return `<span style="font-family:'Instrument Serif';font-style:italic;font-weight:400;font-size:1.22em;letter-spacing:0">${ch}</span>`;
            case 1: return `<span style="font-family:'Geist Mono';font-weight:500;font-size:0.92em;letter-spacing:0">${ch}</span>`;
            case 2: return `<span style="font-style:italic;font-weight:900;color:${col}">${ch}</span>`;
            case 3: return `<span style="font-weight:150">${ch}</span>`;
            case 4: return `<svg width="0.62em" height="0.62em" viewBox="0 0 100 100"><path d="${P[SHAPES[Math.floor(R2() * SHAPES.length)]]}" fill="${col}"/></svg>`;
            case 5: return `<svg width="0.5em" height="0.72em" viewBox="0 0 50 72"><rect width="50" height="72" rx="9" fill="${col}"/><circle cx="25" cy="44" r="10" fill="${COL.K}"/></svg>`;
            default: return `<span style="color:${col}">${ch}</span>`;
          }
        };
        const STEP = 1 / 15;
        gsap.utils.toArray("#word .ch").forEach((chEl, i) => {
          const fin = chEl.querySelector(".fin");
          if (!fin) return;
          const ch = fin.textContent;
          const alts = [0, 1, 2, 3, 4, 5, 6].map((kind) => {
            const a = document.createElement("span");
            a.className = "alt";
            a.innerHTML = altMarkup(ch, kind);
            chEl.appendChild(a);
            return a;
          });
          tl.set(fin, { opacity: 0 }, 12.5);
          const start = 12.82 + i * 0.012;
          const land = 13.02 + i * 0.033;
          let prev = -1, shown = null;
          for (let t = start; t < land - 1e-6; t += STEP) {

            if (shown) tl.set(shown, { opacity: 0 }, t);
            shown = alts[k2];
            tl.set(shown, { opacity: 1 }, t);

          if (shown) tl.set(shown, { opacity: 0 }, land);
          tl.set(fin, { opacity: 1 }, land);
        });
        // settle hit, then a slow living push-in to the end
        tl.fromTo("#logo", { scale: 1 }, { keyframes: [{ scale: 1.018, duration: 0.07, ease: "power2.out" }, { scale: 1, duration: 0.4, ease: "power3.out" }], transformOrigin: "960px 540px" }, 13.5);
        tl.to("#logo", { scale: 1.045, duration: 2.53, ease: "sine.inOut", transformOrigin: "960px 540px" }, 13.97);

        // the link: the lockup eases up a touch and the address rises in quietly beneath it
        tl.to(["#mark", "#word"], { y: -34, duration: 0.7, ease: "power3.inOut" }, 14.55);
        tl.fromTo("#url .wi", { yPercent: 150 }, { yPercent: 0, duration: 0.8, ease: "expo.out", immediateRender: false }, 14.75);
        tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out", immediateRender: false }, 14.75);
